<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphRAG Mentor Auth</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="icon">🚀</div>
            <h2>GraphRAG Mentor</h2>
        </div>

        <!-- Logged Out View -->
        <div id="loggedOutView" class="view">
            <p class="subtitle">Securely log in to track your LeetCode submissions.</p>
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Leetcode Username" />
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" />
            </div>

            <div id="errorMessage" class="error-msg hidden"></div>
            <div id="successMessage" class="success-msg hidden" style="color: #34d399; background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52, 211, 153, 0.2); padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 15px;"></div>

            <button id="loginBtn" class="btn primary">Sign In</button>
            <button id="registerBtn" class="btn secondary">Sign Up</button>
            
            <div style="text-align: center; margin-top: 10px;">
                <button id="showForgotBtn" style="background: none; border: none; color: #94a3b8; font-size: 12px; cursor: pointer;">Forgot Password?</button>
            </div>
            
            <div class="loader hidden" id="loader"></div>
        </div>

        <!-- Forgot Password View -->
        <div id="forgotPasswordView" class="view hidden">
            <p class="subtitle">Reset your password below.</p>
            
            <div class="form-group">
                <label for="resetUsername">Username</label>
                <input type="text" id="resetUsername" placeholder="Leetcode Username" />
            </div>
            
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="••••••••" />
            </div>

            <button id="resetPasswordBtn" class="btn primary">Reset Password</button>
            
            <div style="text-align: center; margin-top: 10px;">
                <button id="backToLoginBtn" style="background: none; border: none; color: #94a3b8; font-size: 12px; cursor: pointer;">Back to Login</button>
            </div>
        </div>

        <!-- Logged In View -->
        <div id="loggedInView" class="view hidden">
            <div class="status-card">
                <p>Welcome back,</p>
                <h3 id="displayUsername" class="accent-text">Username</h3>
            </div>
            
            <div class="status-indicator">
                <span class="dot"></span>
                <span>Active & Tracking Submissions</span>
            </div>

            <button id="logoutBtn" class="btn secondary outline">Log Out</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
